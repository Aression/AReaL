name: Upstream Ascend CPU CI (PR 1797)

on:
  pull_request:
    branches:
      - ascend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ascend-pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pre-commit:
    name: pre-commit
    if: github.repository == 'Aression/AReaL'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: areal-project/AReaL
          ref: dc4b62cf55399d34db053b9c28e7ab01ba1ead77

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install development environment
        run: uv sync --frozen --group dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  cpu-unit-tests:
    name: cpu-unit-tests
    if: github.repository == 'Aression/AReaL'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AREAL_IS_IN_CI: "1"
      CPU_TEST_BASE_SHA: ""
      HF_HOME: "${{ github.workspace }}/.cache/huggingface"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      NO_PROXY: "127.0.0.1,localhost"
      UV_HTTP_RETRIES: "5"
      UV_HTTP_TIMEOUT: "300"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: areal-project/AReaL
          ref: dc4b62cf55399d34db053b9c28e7ab01ba1ead77
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install CPU test environment
        run: uv sync --frozen --group dev

      - name: Verify CPU-only environment
        run: |
          uv run python - <<'PY'
          import torch

          print("torch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          assert not torch.cuda.is_available()
          PY

      - name: Pre-download slow-test artifacts
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
          HF_DATASETS_OFFLINE: "0"
        run: |
          set -euo pipefail

          uv run hf --version

          download_with_retry() {
            local attempt
            local delay

            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi

              if [[ "${attempt}" -lt 5 ]]; then
                delay=$((attempt * 30))
                echo "Download attempt ${attempt} failed; retrying in ${delay}s"
                sleep "${delay}"
              fi
            done

            echo "Download failed after 5 attempts"
            return 1
          }

          download_with_retry \
            uv run hf download \
            openai/gsm8k \
            --repo-type dataset \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            hiyouga/geometry3k \
            --repo-type dataset \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            Qwen/Qwen3-0.6B \
            --exclude "*.safetensors" \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            Qwen/Qwen2.5-VL-3B-Instruct \
            --exclude "*.safetensors" \
            --max-workers 4

      - name: Collect base CPU tests
        if: github.event_name != 'workflow_dispatch'
        env:
          AREAL_TEST_REPORT_DIR: /tmp/base-cpu-test-reports
          CPU_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "${CPU_TEST_BASE_SHA}" || "${CPU_TEST_BASE_SHA}" =~ ^0+$ ]] || \
            ! git cat-file -e "${CPU_TEST_BASE_SHA}^{tree}" 2>/dev/null; then
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && \
              fallback_base_sha="$(git rev-parse --verify HEAD^ 2>/dev/null)"; then
              echo "Base commit ${CPU_TEST_BASE_SHA:-<none>} is unavailable; comparing with ${fallback_base_sha}"
              CPU_TEST_BASE_SHA="${fallback_base_sha}"
            else
              echo "No reachable base commit is available; skipping the comparison"
              exit 0
            fi
          fi
          echo "CPU_TEST_BASE_SHA=${CPU_TEST_BASE_SHA}" >> "${GITHUB_ENV}"

          base_dir="$(mktemp -d)"
          plugin_dir="$(mktemp -d)"
          cleanup() {
            rm -rf -- "${base_dir}" "${plugin_dir}"
          }
          trap cleanup EXIT

          cp scripts/ci_test_report.py "${plugin_dir}/ci_test_report.py"
          if ! git archive "${CPU_TEST_BASE_SHA}" | tar -x -C "${base_dir}"; then
            echo "::warning title=Base CPU comparison unavailable::Could not extract ${CPU_TEST_BASE_SHA}"
            rm -rf -- /tmp/base-cpu-test-reports
            exit 0
          fi

          if ! (
            cd "${base_dir}"
            "${GITHUB_WORKSPACE}/.venv/bin/python" scripts/select_cpu_tests.py \
              --ignore tests/experimental/archon \
              > /tmp/base-cpu-test-files.txt
            mapfile -t base_cpu_test_files < /tmp/base-cpu-test-files.txt
            test "${#base_cpu_test_files[@]}" -gt 0
            PYTHONPATH="${plugin_dir}:${base_dir}" \
              "${GITHUB_WORKSPACE}/.venv/bin/python" -m pytest -q \
              --collect-only \
              -p ci_test_report \
              -m "not npu and not multi_npu and not cuda and not nccl and not sglang and not vllm and not integration" \
              "${base_cpu_test_files[@]}"
          ) > /tmp/base-cpu-collection.log 2>&1; then
            cat /tmp/base-cpu-collection.log
            echo "::warning title=Base CPU comparison unavailable::Base test collection failed"
            rm -rf -- /tmp/base-cpu-test-reports
            exit 0
          fi

      - name: Run CPU unit tests
        env:
          AREAL_TEST_REPORT_DIR: /tmp/current-cpu-test-reports
        run: |
          set -euo pipefail

          uv run python scripts/select_cpu_tests.py \
            --ignore tests/experimental/archon \
            > /tmp/cpu-test-files.txt
          mapfile -t cpu_test_files < /tmp/cpu-test-files.txt
          test "${#cpu_test_files[@]}" -gt 0
          printf 'Selected %s CPU test modules\n' "${#cpu_test_files[@]}"
          uv run pytest -q \
            -p scripts.ci_test_report \
            -m "not npu and not multi_npu and not cuda and not nccl and not sglang and not vllm and not integration" \
            "${cpu_test_files[@]}"

      - name: Report CPU test counts
        if: always()
        run: |
          set -euo pipefail

          if [[ ! -d /tmp/current-cpu-test-reports ]]; then
            echo "CPU test report was not produced"
            exit 0
          fi

          report_args=(
            --current /tmp/current-cpu-test-reports
            --suite CPU
            --step-summary "${GITHUB_STEP_SUMMARY}"
          )
          if [[ -d /tmp/base-cpu-test-reports ]]; then
            git diff --name-only "${CPU_TEST_BASE_SHA}" HEAD -- tests \
              > /tmp/changed-cpu-test-files.txt
            report_args+=(
              --base /tmp/base-cpu-test-reports
              --base-sha "${CPU_TEST_BASE_SHA}"
              --changed-test-files /tmp/changed-cpu-test-files.txt
            )
          fi
          uv run python scripts/ci_test_report.py summarize "${report_args[@]}"
