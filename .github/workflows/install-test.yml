name: Score Centering CPU CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: score-centering-cpu-${{ github.ref }}
  cancel-in-progress: false

env:
  AREAL_IS_IN_CI: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  NO_PROXY: "127.0.0.1,localhost"
  UV_HTTP_RETRIES: "5"
  UV_HTTP_TIMEOUT: "300"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.11
      - name: Install locked development environment
        run: uv sync --frozen --group dev
      - name: Run all pre-commit hooks
        run: uv run --frozen pre-commit run --all-files
      - name: Capture formatting changes
        if: failure()
        run: git diff > pre-commit-changes.patch
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pre-commit-changes
          path: pre-commit-changes.patch
          if-no-files-found: ignore

  cpu-tests:
    name: CPU tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: score-centering
            tests: tests/test_score_centering.py
          - suite: related-regressions
            tests: >-
              tests/test_vllm_generation_request.py
              tests/test_rlvr_reward_logging.py
              tests/test_seqpack.py
              tests/test_loss_aggregation.py
              tests/test_ppo_loss_aggregation_config.py
              tests/test_ppo_actor_controller.py
              tests/test_score_centering_actor.py
              tests/test_score_centering_pipeline.py
              tests/test_ppo_stats.py
              tests/test_prox_approx.py
              tests/test_rollout_version_race.py
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false
      - name: Set up Python
        run: uv python install 3.11
      - name: Install locked development environment
        run: uv sync --frozen --group dev
      - name: Verify CPU test environment
        run: |
          uv run --frozen python - <<'PY'
          import torch
          print("torch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          assert not torch.cuda.is_available()
          PY
      - name: Run tests
        env:
          TEST_FILES: ${{ matrix.tests }}
        run: uv run --frozen pytest -q $TEST_FILES --junitxml=reports/${{ matrix.suite }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.suite }}
          path: reports/*.xml
          if-no-files-found: ignore
