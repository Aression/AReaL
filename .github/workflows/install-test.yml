name: SC loss metrics regression reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AREAL_IS_IN_CI: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.11
      - run: uv sync --frozen --group dev
      - name: Reproduce numeric tracker failures in all four loss paths
        run: uv run --frozen pytest -q tests/test_score_centering.py -k actor_loss_modes
