name: Pre-commit diff capture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.11
      - run: uv sync --frozen --group dev
      - name: Run pre-commit
        run: uv run pre-commit run --all-files || true
      - name: Capture diff
        run: git diff > pre-commit-changes.patch; wc -c pre-commit-changes.patch
      - uses: actions/upload-artifact@v7
        with:
          name: pre-commit-changes
          path: pre-commit-changes.patch
